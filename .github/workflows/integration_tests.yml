---
name: Integration tests
on:
  workflow_run:
    workflows: ["Build container image"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 12 * * *'  # Daily at 12:00 UTC (after build at 10:05)
  workflow_dispatch:

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

permissions:
  contents: read
  packages: read

jobs:
  container-tests:
    name: Container tests
    runs-on: ubuntu-24.04
    # Skip if triggered by a failed build
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: 'v2.6.3'

      - name: Pull published image
        run: |
          podman pull "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"

      - name: Verify published image signature
        run: |
          IMAGE_REF="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
          cosign verify "${IMAGE_REF}" \
            --certificate-identity-regexp 'https://github.com/.+' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

      - name: Verify published provenance attestation
        run: |
          IMAGE_REF="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
          cosign verify-attestation "${IMAGE_REF}" \
            --certificate-identity-regexp 'https://github.com/.+' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --type slsaprovenance

      - name: Verify published SBOM attachment
        run: |
          IMAGE_REF="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
          cosign download sbom "${IMAGE_REF}" > /tmp/published-sbom.spdx.json
          test -s /tmp/published-sbom.spdx.json

      - name: Validate published image labels
        run: |
          podman inspect --format '{{ index .Labels "containers.bootc" }}' "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" | grep -qx '1'

      - name: Run static container tests
        run: |
          podman run --rm \
            --security-opt label=disable \
            -v "$(pwd)/build_files/shared/tests.sh:/run/tests.sh:ro" \
            "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            bash /run/tests.sh

      - name: Build test image (Containerfile.test)
        run: |
          podman build \
            -f Containerfile.test \
            --build-arg BASE="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --tag fedora-kde-test:ci \
            .

      - name: bootc container lint
        run: |
          podman run --rm \
            --security-opt label=disable \
            fedora-kde-test:ci \
            bootc container lint
