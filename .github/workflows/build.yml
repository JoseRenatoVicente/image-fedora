---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
  workflow_dispatch:

env:
  IMAGE_DESC: "Fedora KDE custom image — Aurora base, Mokka theme, dev/gaming packages"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue,kde,plasma,mokka,catppuccin"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-24.04

    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      security-events: write  # for Trivy SARIF upload

    outputs:
      image_ref: ${{ steps.push.outputs.registry-path }}
      image_digest: ${{ steps.push.outputs.digest }}
      image_full: ${{ steps.image_ref.outputs.image_full }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          # GHCR exige owner em minúsculas; IMAGE_VENDOR alimenta o IMAGE_REF
          # gravado no os-release (usado por bootc/Discover para o pull).
          echo "IMAGE_VENDOR=${GITHUB_REPOSITORY_OWNER,,}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set SOURCE_DATE_EPOCH
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> ${GITHUB_ENV}
          echo "SHA_HEAD_SHORT=$(git rev-parse --short HEAD)" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: 'v2.6.3'

      - name: Verify base image signature
        run: |
          BASE_IMAGE=$(awk '
            toupper($1)=="FROM" {
              image=""
              for (i=2; i<=NF; i++) {
                if ($i !~ /^--/) { image=$i; break }
              }
              if (image != "" && image != "scratch") { print image; exit }
            }
          ' ./Containerfile)
          [[ -n "$BASE_IMAGE" ]] || { echo "ERROR: imagem base não encontrada no Containerfile"; exit 1; }
          echo "Verifying base image: ${BASE_IMAGE}"
          curl -sL --fail --retry 3 --retry-delay 5 -o /tmp/fedora-ostree.pub \
            "https://gitlab.com/fedora/ostree/ci-test/-/raw/main/quay.io-fedora-ostree-desktops.pub"
          cosign verify --key /tmp/fedora-ostree.pub "${BASE_IMAGE}"
          rm -f /tmp/fedora-ostree.pub
          echo "Base image signature verified."

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +%Y\-%m\-%d\T%H\:%M\:%S\Z)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: metadata
        with:
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ github.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ github.sha }}/Containerfile
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ github.sha }}
            org.opencontainers.image.vendor=${{ env.IMAGE_VENDOR }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=false
            containers.bootc=1
          sep-tags: " "
          sep-annotations: " "

      - name: Login to GHCR (for layer cache)
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@061ffd31bb5c3f8733a6f9bbdf00a9fb02eb708c # v2 (node24)
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          oci: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            IMAGE_VENDOR=${{ env.IMAGE_VENDOR }}
            SHA_HEAD_SHORT=${{ env.SHA_HEAD_SHORT }}
          extra-args: |
            --layers
            --cache-from=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}

      # ── Vulnerability scan (runs on all builds including PRs) ───────────
      - name: Export image for scanning
        run: buildah push localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }} docker-archive:/tmp/image-scan.tar

      - name: Run Trivy vulnerability scanner (PR advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          input: '/tmp/image-scan.tar'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          timeout: '10m'
          skip-files: 'sysroot/ostree/repo/objects/**'

      - name: Run Trivy vulnerability scanner (main gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          input: '/tmp/image-scan.tar'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          timeout: '10m'
          skip-files: 'sysroot/ostree/repo/objects/**'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@1a818fd5f97ed0ee9a823421bd5b171add01227f # v4.36.2
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      # Free disk space after scanning
      - name: Clean up scan artifacts
        if: always()
        run: rm -f /tmp/image-scan.tar

      # ── Push (only on main branch, not PRs) ─────────────────────────────
      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Set image ref output
        id: image_ref
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "image_full=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

      # ── SBOM generation (after push, scans remote image) ─────────────────
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.20.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        with:
          image: '${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}'
          artifact-name: sbom-${{ env.IMAGE_NAME }}.spdx.json
          output-file: sbom.spdx.json
          format: spdx-json

      # ── Cosign image signing ────────────────────────────────────────────
      - name: Sign container image (keyless)
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          IMAGE_FULL="${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}"
          for tag in ${{ steps.metadata.outputs.tags }}; do
            cosign sign -y --recursive "${IMAGE_FULL}:${tag}"
          done

      # ── Attach SBOM to signed image ─────────────────────────────────────
      - name: Attach SBOM to image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          if [[ -f sbom.spdx.json ]]; then
            IMAGE_REF="${{ steps.push.outputs.registry-path }}@${{ steps.push.outputs.digest }}"
            cosign attach sbom --sbom sbom.spdx.json "${IMAGE_REF}"
          fi

  # ── SLSA Provenance (Level 3) ─────────────────────────────────────────────
  provenance:
    needs: [build_push]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      image: ${{ needs.build_push.outputs.image_full }}
      digest: ${{ needs.build_push.outputs.image_digest }}
    secrets:
      registry-username: ${{ github.actor }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  verify-published:
    name: Verify published image
    needs: [build_push, provenance]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: 'v2.6.3'

      - name: Verify published image signature
        env:
          IMAGE_REF: ${{ needs.build_push.outputs.image_full }}@${{ needs.build_push.outputs.image_digest }}
        run: |
          cosign verify "${IMAGE_REF}" \
            --certificate-identity-regexp 'https://github.com/.+' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

      - name: Verify published provenance attestation
        env:
          IMAGE_REF: ${{ needs.build_push.outputs.image_full }}@${{ needs.build_push.outputs.image_digest }}
        run: |
          cosign verify-attestation "${IMAGE_REF}" \
            --certificate-identity-regexp 'https://github.com/.+' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --type slsaprovenance

      - name: Verify published SBOM attachment
        env:
          IMAGE_REF: ${{ needs.build_push.outputs.image_full }}@${{ needs.build_push.outputs.image_digest }}
        run: |
          cosign download sbom "${IMAGE_REF}" > /tmp/published-sbom.spdx.json
          test -s /tmp/published-sbom.spdx.json
