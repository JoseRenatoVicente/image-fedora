---
name: Tests
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-tests:
    name: Source tests
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install BATS
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Source tests
        run: bats tests/source/

  exec-bits:
    name: Validate executable bits
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check executable bits on scripts
        run: |
          # Um *.sh COM shebang `#!` é executado directamente e tem de ter +x.
          # *.sh SEM shebang são sourced (profile.d, assets-manifest, package-lists)
          # e não precisam. Scripts em /usr/libexec recebem chmod nos módulos de
          # configuração; ficheiros .bats correm via `bats` — nenhum entra aqui.
          FAILED=0
          check_exec() {
            local f="$1"
            if [[ ! -x "$f" ]]; then
              echo "FAIL: missing +x on $f"
              FAILED=1
            fi
          }
          while IFS= read -r -d '' f; do
            IFS= read -r firstline < "$f" || true
            case "$firstline" in
              '#!'*) check_exec "$f" ;;
            esac
          done < <(find build_files tests -name "*.sh" -print0)
          # Wrappers instalados como binários (sem extensão .sh)
          check_exec build_files/overlay/usr/bin/dnf
          check_exec build_files/assets/configs/wpctl-steam-wrapper
          [[ $FAILED -eq 0 ]] || exit 1
          echo "All executable bits OK"

  just-lint:
    name: Justfile lint
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # O `just` do apt (ubuntu-24.04) é antigo e desconhece o atributo
      # [group(...)] usado nos justfiles → instala-se uma versão moderna.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Justfile formatting
        run: just --unstable --fmt --check -f Justfile

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          # Lint scripts por extensão E por shebang de shell — apanha scripts
          # sem extensão (ex.: usr/libexec/*, usr/bin/dnf) que de outra forma
          # escapariam à verificação.
          {
            find build_files tests tools -type f \( -name "*.sh" -o -name "*.bats" -o -name "*.bash" \)
            find build_files tests tools -type f -exec sh -c 'head -1 "$1" | grep -qE "^#!.*\b(ba)?sh\b"' _ {} \; -print
          } | sort -u | xargs shellcheck -e SC1091 -e SC2154
