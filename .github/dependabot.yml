version: 2
updates:
  # GitHub Actions - pin e atualizar actions por SHA
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Container base images - detectar atualizações do Fedora Kinoite
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
