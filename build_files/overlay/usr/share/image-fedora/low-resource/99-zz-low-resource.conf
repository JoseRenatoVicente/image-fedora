# Tuning de VM para sistemas com pouca RAM (≤ ~6 GB) — instalado pelo
# low-resource-tuning.service como /etc/sysctl.d/99-zz-low-resource.conf.
#
# O nome tem de ordenar DEPOIS de 99-performance.conf: o systemd-sysctl aplica
# os ficheiros de sysctl.d em ordem lexical e o último a definir uma chave
# vence. O nome antigo (100-low-resource.conf) ordenava ANTES ('1' < '9'),
# então a partir do segundo boot o 99-performance.conf sobrepunha tudo e o
# perfil ficava silenciosamente inerte.

# Aumenta pressão para libertar caches de inode/dentry: builds, node_modules e
# indexação de IDE enchem estes caches rápido, e com pouca RAM vale reciclá-los
# cedo (99-performance.conf usa 50 nas máquinas folgadas).
vm.vfs_cache_pressure = 200

# swappiness NÃO é sobreposto de propósito: mantém-se o 180 herdado de
# 99-performance.conf. Com swap exclusivamente em zram + tier de recompressão
# (zram-recompress, ratio medido ~4x), mover páginas anónimas frias para
# memória comprimida é mais barato do que despejar page cache que depois volta
# do disco através do LUKS — a mesma filosofia "ratio sobre latência" do
# design de memória em camadas. (A versão anterior deste perfil punha 60, mas
# nunca chegou a vigorar por causa do bug de ordenação acima.)

# Desativa read-ahead no swap (zram é random-access).
vm.page-cluster = 0
