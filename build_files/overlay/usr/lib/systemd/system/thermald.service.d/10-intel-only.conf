# thermald é o Intel Thermal Daemon — não suporta CPUs AMD. Sem este guard,
# ele arranca e falha ("Unsupported cpu model or platform") em todo boot em
# hardware AMD (imagem é mista Intel+AMD). intel_pstate só existe no sysfs
# em CPUs Intel com esse driver, tal como o amd-cpb-boost.service usa
# amd_pstate/cpb_boost para o guard equivalente do lado AMD.
[Unit]
ConditionPathExists=/sys/devices/system/cpu/intel_pstate
