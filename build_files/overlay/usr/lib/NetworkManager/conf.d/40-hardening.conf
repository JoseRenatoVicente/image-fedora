[device]
# Randomize MAC on every Wi-Fi scan to prevent passive tracking
wifi.scan-rand-mac-address=yes

[main]
# Don't auto-set the system hostname from DHCP/rDNS (avoids leaking/changing it)
hostname-mode=none

[connection]
# RFC 4941 IPv6 privacy extensions: prefer temporary addresses
ipv6.ip6-privacy=2
# Stable per-network MAC for Wi-Fi (consistent but not globally trackable)
wifi.cloned-mac-address=stable
# Preserve real MAC for wired connections (needed for 802.1X / corporate nets)
ethernet.cloned-mac-address=preserve
# Don't advertise our hostname to DHCP servers (passive tracking vector)
ipv4.dhcp-send-hostname=0
ipv6.dhcp-send-hostname=0

[connectivity]
# Disable the periodic connectivity check (NCSI) — phones home to a probe URL
enabled=false
