# Kernel boot parameters de performance.
# Instalado em /usr/lib/bootc/kargs.d/20-performance.toml (merge com os de hardening).

kargs = [
  # Desliga o zswap: usamos zram como swap comprimido. zswap activo intercepta
  # as páginas antes do zram e impede a contabilização correcta (zramctl),
  # além de duplicar compressão. Mantemos vm.swappiness=180 em sysctl para usar
  # ZRAM agressivamente antes de descartar cache quente.
  "zswap.enabled=0",
  # Desactiva transições de power state do NVMe (APST). Elimina picos de
  # latência de 30-100ms causados por wake de PS3/PS4 — crítico para gaming.
  # Custo: ~1W de consumo idle extra. Derivado de Bazzite-Config.
  "nvme_core.default_ps_max_latency_us=0",
  # THP=madvise: só usa huge pages nas regiões que a app pede explicitamente
  # via madvise(MADV_HUGEPAGE) (bancos de dados, VMs, JVMs). Evita o overhead
  # de compactação de memória de "always" em cargas de trabalho genéricas de
  # desktop, mantendo o ganho de TLB onde a app sabe que compensa.
  "transparent_hugepage=madvise",
  # tsc=reliable removido de propósito: desliga o watchdog de clocksource
  # incondicionalmente, mesmo em CPUs mais antigas/defeituosas com TSC
  # instável (drift silencioso de relógio sem detecção). Esta imagem é mista
  # AMD+Intel/hardware variado e não tem mecanismo de kargs condicionais por
  # hardware (ao contrário dos serviços oneshot com ConditionPathExists usados
  # para amd-cpb-boost/intel-pstate-floor) — o overhead do watchdog é aceitável
  # face ao risco de drift silencioso em hardware antigo. Derivado de
  # XanMod/Clear Linux, mas não replicado aqui.
  # rcu_nocbs=all: tira o processamento de callbacks RCU do hot path de todos
  # os CPUs, reduzindo jitter/latência de scheduling. O ganho clássico é com
  # isolcpus (CPUs dedicados sem RCU), que não usamos aqui — em "all" sem
  # isolamento o benefício é mais modesto, mas ainda reduz picos de latência
  # em cargas interativas. Derivado de XanMod/Clear Linux.
  "rcu_nocbs=all",
  # preempt=full: selecciona o modelo de preempção total em runtime via
  # CONFIG_PREEMPT_DYNAMIC (o kernel Fedora vem compilado com os 3 modelos
  # disponíveis; default costuma ser voluntary). full prioriza latência de
  # scheduling sobre throughput bruto — mesmo objectivo do BORE/scx_lavd já
  # usados aqui, sem precisar de kernel/patch próprio. Custo: mais overhead
  # de preempção em cargas 100% CPU-bound (compilação, encoding em lote).
  # Derivado de CachyOS (CONFIG_CACHY / PREEMPT_DYNAMIC).
  "preempt=full",
]
