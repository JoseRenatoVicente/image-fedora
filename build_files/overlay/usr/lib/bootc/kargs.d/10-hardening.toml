# Kernel boot parameters de hardening (derivado de secureblue)
# Instalado em /usr/lib/bootc/kargs.d/10-hardening.toml

kargs = [
  # Boot appearance: quiet suppresses kernel/initrd text; rhgb é o trigger do
  # Plymouth no Fedora (o `splash` estilo Debian é ignorado pelo plymouthd do
  # Fedora). Sem rhgb não há animação de boot — vê-se a consola de texto.
  "quiet",
  "rhgb",
  "splash",
  # debugfs=off: desactiva o debugfs completamente, evitando fuga de informação
  # do kernel via /sys/kernel/debug/ (endereços internos, estado de hardware).
  "debugfs=off",
  "hash_pointers=always",
  # lsm=: define explicitamente a ordem do stack LSM, activando Landlock.
  # Landlock é um LSM de sandboxing que permite a processos restringirem o seu
  # próprio acesso ao filesystem (semelhante a seccomp mas para ficheiros).
  # A ordem importa: capability é implícito e não listado; selinux e bpf devem
  # estar presentes ou o MAC e o BPF LSM ficam inativos.
  "lsm=landlock,lockdown,yama,integrity,selinux,bpf",
  "init_on_alloc=1",
  "init_on_free=1",
  "efi=disable_early_pci_dma",
  "intel_iommu=on",
  "iommu.passthrough=0",
  "iommu.strict=1",
  "iommu=force",
  # bdev_allow_write_mounted=0: proíbe escrita directa a block devices com
  # filesystems montados (ex: dd if=/dev/zero of=/dev/sda enquanto / está montado).
  # Bloqueia bypass das abstrações do filesystem. Marcado como "unstable" pelo
  # secureblue (pode afetar ferramentas de backup que fazem raw I/O), mas seguro
  # num desktop standard.
  "bdev_allow_write_mounted=0",
  "l1d_flush=on",
  "l1tf=full,force",
  "lockdown=integrity",
  "loglevel=0",
  # oops=panic: converte qualquer kernel oops num panic imediato.
  # Sem isto o kernel tenta continuar após um oops, deixando uma janela de
  # exploração num estado inconsistente. Combinado com kernel.panic=-1
  # (sysctl) o sistema reinicia imediatamente. Complementa kernel.oops_limit.
  "oops=panic",
  # rd.shell=0 + rd.emergency=halt: bloqueiam o debug shell e o modo emergency
  # do initramfs. Sem isto, certas falhas de boot (ex: LUKS timeout) atiram
  # um shell root antes do pivot — vetor de injeção de malware no initramfs.
  # Ver CVE/blog 2025-07 insinuator.net/insecure-boot-injecting-initramfs.
  "rd.shell=0",
  "rd.emergency=halt",
  "extra_latent_entropy",
  # KFENCE: amostrador de segurança do heap do kernel (UAF, OOB, double-free).
  # Desactivado por defeito para evitar overhead e stalls em desktop/gaming.
  # Para activar em modo diagnóstico, use kfence.sample_interval=100.
  # "kfence.sample_interval=100",
  "mitigations=auto",
  # module.sig_enforce=1: rejeita módulos de kernel não assinados.
  # Drivers NVIDIA via rpm-ostree install (kmod-nvidia) são assinados pelo
  # Fedora e funcionam normalmente. Módulos compilados localmente via DKMS
  # NÃO são suportados em sistemas atômicos e seriam rejeitados.
  "module.sig_enforce=1",
  "page_alloc.shuffle=1",
  "proc_mem.force_override=ptrace",
  "pti=on",
  "random.trust_bootloader=off",
  "random.trust_cpu=off",
  "randomize_kstack_offset=on",
  "slab_nomerge",
  # NOTA: slab_debug=FZ removido — sanity checks/red zones determinísticos
  # causavam overhead 3-5% e stalls visíveis no desktop. KFENCE também desactivado.
  # "slab_debug=FZ",
  "gather_data_sampling=force",
  "reg_file_data_sampling=on",
  "spec_store_bypass_disable=on",
  "spectre_bhi=on",
  "spectre_v2=on",
  # spec_rstack_overflow=safe-ret: mitigação do AMD Inception (SRSO,
  # CVE-2023-20569) — envenenamento da return stack. safe-ret é o modo
  # recomendado pela AMD (overhead baixo vs. ibpb). No-op em CPUs Intel.
  "spec_rstack_overflow=safe-ret",
  "ssbd=force-on",
  # NOTA: page_poison=1 removido — init_on_free=1 já zera páginas libertadas;
  # page_poison adicionava overhead de preenchimento sem ganho prático no desktop.
  # "page_poison=1",
  # ftrace=off: desativa o framework de function tracing do kernel, removendo
  # uma superfície de introspeção/abuso. Sem impacto num desktop (só afeta
  # debugging avançado com ftrace/perf trace).
  "ftrace=off",
  "tsx=off",
  "systemd.ssh_auto=no",
  "vdso32=0",
  "vsyscall=none",
]
