# Copy KDE theme config to root's home on first boot (if files don't already exist).
# Needed because root logs in to a bare /var/roothome that never gets /etc/skel content.
# The C type only acts if the target path does not already exist.
C /root/.config/kdeglobals 0600 root root - /etc/skel/.config/kdeglobals
C /root/.config/plasmarc 0600 root root - /etc/skel/.config/plasmarc
C /root/.config/kwinrc 0600 root root - /etc/skel/.config/kwinrc
C /root/.config/ksplashrc 0600 root root - /etc/skel/.config/ksplashrc
C /root/.config/kscreenlockerrc 0600 root root - /etc/skel/.config/kscreenlockerrc
C /root/.config/kcminputrc 0600 root root - /etc/skel/.config/kcminputrc
C /root/.config/plasma-org.kde.plasma.desktop-appletsrc 0600 root root - /etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc
C /root/.config/Kvantum 0700 root root - /etc/skel/.config/Kvantum
C /root/.config/gtk-3.0 0700 root root - /etc/skel/.config/gtk-3.0
C /root/.config/gtk-4.0 0700 root root - /etc/skel/.config/gtk-4.0
