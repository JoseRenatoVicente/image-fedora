# bluetoothd (ConfigurationDirectoryMode=0555) exige /etc/bluetooth em 0555,
# mas o pacote bluez cria o dir em 0755. Um chmod feito só no build (ver
# 90-cleanup.sh) é uma mudança de metadata-only numa dir já existente na
# camada base, e observámos em produção que não sobrevive à exportação da
# imagem OCI/ostree (dir volta a 755 no /usr/etc final). `z` aqui re-aplica
# o modo em CADA arranque via systemd-tmpfiles-setup.service, imune a isso.
z /etc/bluetooth 0555 root root - -
