# Kernel Samepage Merging (KSM) — activa o scanner global (ksmd).
# Sem isto, MemoryKSM=yes nas slices (ver etc/systemd/system/
# machine.slice.d/10-ksm.conf) não tem efeito: o kernel só percorre páginas
# marcadas como mergeable se /sys/kernel/mm/ksm/run estiver a 1.
# Relevante para VMs (WinApps, libvirt) em machine.slice, que partilham
# páginas idênticas de memória. Derivado de cachyos-ksm-settings.
w! /sys/kernel/mm/ksm/run - - - - 1
