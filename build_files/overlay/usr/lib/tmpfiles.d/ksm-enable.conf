# Kernel Samepage Merging (KSM) — activa o scanner global (ksmd).
# Sem isto, MemoryKSM=yes nos serviços (ver etc/systemd/system/
# user@.service.d/10-ksm.conf) não tem efeito: o kernel só percorre páginas
# marcadas como mergeable se /sys/kernel/mm/ksm/run estiver a 1.
# Relevante para toolbox/distrobox e VMs de sessão (WinApps, libvirt) que
# partilham páginas idênticas de memória. Derivado de cachyos-ksm-settings.
w! /sys/kernel/mm/ksm/run - - - - 1
