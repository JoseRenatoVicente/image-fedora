# Blacklist de módulos de kernel desnecessários / perigosos (secureblue-derived)
# Nota: o beep do PC speaker (pcspkr/snd-pcsp) está em nobeep.conf — é
# anti-incômodo, não hardening.

# Protocolos de rede não utilizados
install dccp /bin/false
install xt_dccp /bin/false      # netfilter extension for DCCP
install sctp /bin/false
install xt_sctp /bin/false      # netfilter extension for SCTP
install sctp_diag /bin/false    # SCTP diagnostic module
install rds /bin/false
install rds_rdma /bin/false     # RDS over RDMA variant
install rds_tcp /bin/false      # CVE-2026-43494 PinTheft
alias net-pf-21 off             # desactiva família AF_RDS ao nível de socket
install tipc /bin/false
install tipc_diag /bin/false    # TIPC diagnostic
install n-hdlc /bin/false
install hdlcdrv /bin/false      # HDLC amateur radio protocol driver
install ax25 /bin/false
install netrom /bin/false
install x25 /bin/false
install rose /bin/false
install decnet /bin/false
install econet /bin/false
install af_802154 /bin/false
install ipx /bin/false
install appletalk /bin/false
install psnap /bin/false
install p8023 /bin/false
install p8022 /bin/false
install can /bin/false
install atm /bin/false
install usbatm /bin/false       # USB ATM transport
install xusbatm /bin/false      # Extended USB ATM
install pppoatm /bin/false      # PPP over ATM
install atmtcp /bin/false       # ATM over TCP
# MCTP (Management Component Transport Protocol) — firmware/BMC bus, not a desktop protocol
install mctp-serial /bin/false
install mctp-usb /bin/false
install mctp-i3c /bin/false
# BATMAN Advanced — mesh networking; not used on a standard desktop
install batman-adv /bin/false

# Firewire e Thunderbolt (vetores de ataque DMA)
install firewire-core /bin/false
install firewire_core /bin/false
install firewire-ohci /bin/false
install firewire_ohci /bin/false
install firewire_sbp2 /bin/false
install firewire-sbp2 /bin/false
install firewire-net /bin/false
install thunderbolt /bin/false
install thunderbolt_net /bin/false  # Thunderbolt networking (IP over TB)
install ohci1394 /bin/false
install sbp2 /bin/false
install dv1394 /bin/false
install raw1394 /bin/false
install video1394 /bin/false
install nosy /bin/false             # FireWire packet analyzer (debug tool)
install firedtv /bin/false          # FireDTV (DVB via FireWire)

# Filesystems não utilizados (squashfs mantido para AppImage/containers)
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install udf /bin/false
# CIFS/SMB client and server
install cifs /bin/false
install cifs_md4 /bin/false         # CIFS MD4 hash (legacy LM auth)
install ksmbd /bin/false
# NFS client
install nfs /bin/false
install nfsv3 /bin/false
install nfsv4 /bin/false
install nfs_acl /bin/false          # NFS ACL support
# NFS server (not needed on a desktop)
install nfsd /bin/false
install nfs_layout_flexfiles /bin/false
install nfs_layout_nfsv41_files /bin/false
install nfs_localio /bin/false
install grace /bin/false            # NFS grace period manager
install lockd /bin/false            # NFS file locking
# RPC security (goes with nfs/kerberos)
install rpcsec_gss_krb5 /bin/false
install auth_rpcgss /bin/false
install gfs2 /bin/false
install reiserfs /bin/false
install kafs /bin/false
install orangefs /bin/false
# 9P filesystem and transports (used for QEMU shared folders via virtio-9p;
# block all since VirtFS/9P is a guest attack surface and virtiofs is preferred)
install 9p /bin/false
install 9pnet /bin/false
install 9pnet_fd /bin/false
install 9pnet_rdma /bin/false
install 9pnet_usbg /bin/false
install 9pnet_virtio /bin/false
install 9pnet_xen /bin/false
install adfs /bin/false
install affs /bin/false
install afs /bin/false
install befs /bin/false
install ceph /bin/false
install coda /bin/false
install ecryptfs /bin/false
install jfs /bin/false
install minix /bin/false
install nilfs2 /bin/false
# OCFS2 and its cluster stack (Oracle Cluster FS, not a desktop filesystem)
install ocfs2 /bin/false
install dlm /bin/false              # Distributed Lock Manager (OCFS2/GFS2 dep)
install ocfs2_dlm /bin/false
install ocfs2_dlmfs /bin/false
install ocfs2_nodemanager /bin/false
install ocfs2_stackglue /bin/false
install ocfs2_stack_o2cb /bin/false
install ocfs2_stack_user /bin/false
install romfs /bin/false
install ubifs /bin/false
install zonefs /bin/false
install sysv /bin/false
install ufs /bin/false
# Android x86 tablet BSP driver (not relevant on PC hardware)
install x86-android-tablets /bin/false

# Driver de teste de vídeo (não usar em produção)
install vivid /bin/false

# GNSS (não necessário em desktop)
install gnss /bin/false
install gnss-mtk /bin/false
install gnss-serial /bin/false
install gnss-sirf /bin/false
install gnss-usb /bin/false
install gnss-ubx /bin/false

# Bluetooth (superfície de ataque considerável)
# Descomente se não usa bluetooth:
# install bluetooth /bin/false
# install btusb /bin/false

# Joystick driver (mantido para gaming - Steam/Lutris/Heroic)
# install joydev /bin/false

# ath_pci (driver legado)
install ath_pci /bin/false

# CD-ROM (mantido para montagem de ISOs)
# install cdrom /bin/false
# install sr_mod /bin/false

# dirtyfrag mitigation / RxRPC
install rxrpc /bin/false

# NVMe over TCP — CVE-2026-23112 "nvmet-tcp Bounds" (CVSS 7.8)
install nvmet_tcp /bin/false

# Userspace crypto API (AF_ALG) — superfície de ataque, não usada em desktop.
# Já gerou várias CVEs (algif_skcipher/algif_aead). NÃO afeta LUKS/dm-crypt,
# que falam com a crypto API do kernel diretamente. Único consumidor relevante
# seria o iwd (daemon WiFi da Intel) — não usado: NetworkManager + wpa_supplicant.
install af_alg /bin/false
install algif_hash /bin/false
install algif_skcipher /bin/false
install algif_rng /bin/false
install algif_aead /bin/false

# IPSec / ESP / xfrm — NÃO blacklisted por defeito.
# Estes módulos são necessários para VPNs corporativas (IPSec, L2TP) e
# WireGuard em certos cenários. Blacklistá-los quebraria conectividade VPN.
# Para ambientes de alta segurança sem VPN, copie o ficheiro opcional:
#   /usr/share/fedora-hardening/modprobe-ipsec-blacklist.conf
# para /etc/modprobe.d/ e reinicie.
