# /etc/tmpfiles.d/provision.conf
# Substitui /usr/lib/tmpfiles.d/provision.conf para compatibilidade com OSTree.
#
# No OSTree, /root é um symlink para /var/roothome. O tipo d- no provision.conf
# upstream tenta criar /root como diretório e falha ao encontrar o symlink:
#   systemd-tmpfiles: "/root" already exists and is not a directory.
# Este override usa o caminho real /var/roothome para provisionamento SSH,
# preservando toda a funcionalidade de cloud-init/credentials.
f^ /etc/motd.d/50-provision.conf    -    -    -    -    login.motd
f^ /etc/issue.d/50-provision.conf   -    -    -    -    login.issue
f^ /etc/hosts                       -    -    -    -    network.hosts
d  /var/roothome                    0700 root root -
d  /var/roothome/.ssh               0700 root root -
f^ /var/roothome/.ssh/authorized_keys 0600 root root - ssh.authorized_keys.root
