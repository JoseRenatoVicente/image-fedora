# /etc/tmpfiles.d/home.conf
# Substitui /usr/lib/tmpfiles.d/home.conf para compatibilidade com OSTree.
#
# No OSTree, /home e /srv são symlinks para /var/home e /var/srv.
# O tipo Q (btrfs subvolume quota) exige um diretório real — ao encontrar um
# symlink, systemd-tmpfiles reporta erro "already exists and is not a directory".
# Este override aponta para os caminhos reais dos subvolumes btrfs.
#
# Tipo Q: cria grupo de quota btrfs (falha silenciosa se não for btrfs)
# Tipo q: idem, mas não falha se o recurso não estiver disponível
Q /var/home 0755 - - -
q /var/srv  0755 - - -
