# Hardening de hardware externo (derivado de cipherblue/secureblue)
# Força nosuid,nodev,noexec em TODO disco montado dinamicamente pelo udisks2
# (auto-mount de pendrives/HDs externos via GUI ou udisksctl).
#
# Bloqueia execução de binários/malware a partir de mídia removível e impede
# escalonamento via binários suid trazidos de fora.
#
# ÂMBITO: só afeta montagens dinâmicas do udisks2. Drives permanentes via
# /etc/fstab ou unidades .mount do systemd NÃO são afetados — uma biblioteca
# Steam num drive fixo continua executável normalmente.
#
# Para relaxar (ex.: rodar AppImage/jogos de um pendrive), remova `noexec` da
# linha do filesystem correspondente e de `allow=`.

[defaults]
# Baseline global para qualquer filesystem não identificado
defaults=nosuid,nodev,noexec

# Enforcement explícito para formatos comuns de USB/externos
vfat_defaults=uid=$UID,gid=$GID,shortname=mixed,utf8=1,showexec,flush,nosuid,nodev,noexec
exfat_defaults=uid=$UID,gid=$GID,iocharset=utf8,errors=remount-ro,nosuid,nodev,noexec
ntfs_defaults=uid=$UID,gid=$GID,windows_names,nosuid,nodev,noexec
ext4_defaults=nosuid,nodev,noexec
btrfs_defaults=nosuid,nodev,noexec

# Impede que o utilizador passe flags de mount customizadas (GUI/CLI) para
# burlar o acima
allow=nosuid,nodev,noexec
