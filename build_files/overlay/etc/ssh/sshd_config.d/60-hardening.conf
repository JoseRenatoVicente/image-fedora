# Hardening de sshd (defense-in-depth).
# NOTA: o sshd está DESATIVADO por defeito (35-security-desktop.preset).
# Este drop-in só tem efeito se alguém habilitar o serviço manualmente.
# Não desativamos PasswordAuthentication para não trancar quem ligar o
# sshd ad-hoc esperando login por password.

PermitRootLogin no
PermitEmptyPasswords no
LoginGraceTime 1m
MaxAuthTries 3
ClientAliveInterval 600
ClientAliveCountMax 0
X11Forwarding no
UseDNS no
