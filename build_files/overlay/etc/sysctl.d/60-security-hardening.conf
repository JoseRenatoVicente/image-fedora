# Security hardening (derivado de secureblue + fedora-setup)

# ── Rede ──────────────────────────────────────────────────────────────────────
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
# Encurta retransmissões SYN-ACK (anti SYN-flood half-open)
net.ipv4.tcp_synack_retries = 2
# Mitiga ataque TCP off-path por challenge-ACK (CVE-2016-5696)
net.ipv4.tcp_challenge_ack_limit = 1000000
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.*.send_redirects = 0
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.*.secure_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
net.ipv4.conf.*.shared_media = 0
net.ipv4.conf.*.arp_filter = 1
net.ipv4.conf.*.arp_ignore = 2
net.ipv4.conf.all.drop_gratuitous_arp = 1
net.ipv6.conf.all.drop_unsolicited_na = 1
net.ipv4.conf.all.drop_unicast_in_l2_multicast = 1
net.ipv6.conf.all.drop_unicast_in_l2_multicast = 1
net.ipv4.igmp_link_local_mcast_reports = 0
net.ipv4.conf.*.accept_source_route = 0
net.ipv6.conf.*.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.icmp_echo_ignore_all = 1
net.ipv6.icmp.echo_ignore_all = 1
net.ipv4.tcp_timestamps = 0
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# ── Kernel ────────────────────────────────────────────────────────────────────
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.perf_event_paranoid = 3
kernel.perf_event_max_sample_rate = 1
kernel.perf_cpu_time_max_percent = 1
kernel.sysrq = 0
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
kernel.kexec_load_disabled = 1
kernel.oops_limit = 100
kernel.warn_limit = 100
kernel.panic = -1
kernel.printk = 3 3 3 3
kernel.randomize_va_space = 2
kernel.core_pattern = |/bin/false
kernel.io_uring_disabled = 2
# ── Filesystem ────────────────────────────────────────────────────────────────
fs.suid_dumpable = 0
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_regular = 2
fs.protected_fifos = 2
fs.binfmt_misc.status = 0
dev.tty.ldisc_autoload = 0
# Bloqueia injeção de comandos no terminal via TIOCSTI (classe CVE-2017-5226)
dev.tty.legacy_tiocsti = 0

# ── VM / Memória ──────────────────────────────────────────────────────────────
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16
vm.mmap_min_addr = 65536
vm.unprivileged_userfaultfd = 0
# Needed for Chrome/Electron, gaming (Steam/Wine), and dev tools (VS Code, JVM).
# secureblue sets this; default kernel limit (65530) is too low for these workloads.
vm.max_map_count = 1048576

# ── ASLR ──────────────────────────────────────────────────────────────────────