# ──────────────────────────────────────────────────────────────────────────────
# Tuning de performance para workstation/desktop/gaming
# ──────────────────────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────────────────────
# Rede — baixa latência e alta vazão
# ──────────────────────────────────────────────────────────────────────────────

# Disciplina de fila moderna para reduzir latência e melhorar fairness.
net.core.default_qdisc = fq

# Congestion control BBR: boa vazão + baixa latência.
net.ipv4.tcp_congestion_control = bbr

# Habilita TCP Fast Open nos cliente e servidor para eliminar 1 RTT.
net.ipv4.tcp_fastopen = 3

# Procura ativamente pelo MTU correto, evitando fragmentação silenciosa.
net.ipv4.tcp_mtu_probing = 1

# Não carrega métricas antigas de congestionamento para novas conexões.
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_no_ssthresh_metrics_save = 1

# Mantém a janela de congestionamento após idle, evitando quedas de throughput.
net.ipv4.tcp_slow_start_after_idle = 0

# Faixa completa de portas efêmeras para muitas conexões simultâneas.
net.ipv4.ip_local_port_range = 1024 65535

# Backlog generoso para bursts de conexões (servidores locais, games, etc).
net.ipv4.tcp_max_syn_backlog = 8192
net.core.somaxconn = 4096

# Buffers de socket amplos para transferências e streaming.
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.ipv4.tcp_rmem = 4096 131072 33554432
net.ipv4.tcp_wmem = 4096 262144 33554432

# Aumenta a capacidade de processamento de pacotes no softirq.
net.core.netdev_budget = 5000
net.core.netdev_budget_usecs = 8000
net.core.netdev_max_backlog = 16384

# Limita dados ainda não enviados no socket, reduzindo latência perceptível.
net.ipv4.tcp_notsent_lowat = 16384

# Keepalive mais rápido para limpar conexões mortas.
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 3

# TIME_WAIT mais curto + reuse: limpa conexões obsoletas mais rápido.
net.ipv4.tcp_fin_timeout = 5
net.ipv4.tcp_tw_reuse = 1

# Tabelas ARP/ndisc maiores para cenários com muitos peers.
net.ipv4.neigh.default.gc_thresh1 = 512
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096
net.ipv6.neigh.default.gc_thresh1 = 512
net.ipv6.neigh.default.gc_thresh2 = 2048
net.ipv6.neigh.default.gc_thresh3 = 4096

# Busy polling: reduz latência de rede a custo de CPU. Desactivado por
# defeito para não consumir ciclos em desktop comum. Para competição/gaming
# de baixa latência, defina ambos para 50 e configure IRQ affinity.
net.core.busy_poll = 0
net.core.busy_read = 0

# AIO maior para aplicações e containers que fazem muita I/O assíncrona.
fs.aio-max-nr = 1048576

# ──────────────────────────────────────────────────────────────────────────────
# Memória / VM — resposta rápida e evitar stalls
# ──────────────────────────────────────────────────────────────────────────────

# swappiness=180: pressiona o kernel a mover páginas anónimas para ZRAM mais
# agressivamente antes de evitar a paginação. Liberta RAM para ficheiros ativos
# (buffers/cache) que são mais baratos de recuperar. O zswap está desativado
# via kargs; o zram é o swap comprimido.
vm.swappiness = 180

# Mantém o cache de dentries/inodes na RAM (menor pressão de reclaim).
vm.vfs_cache_pressure = 50

# Desactivar read-ahead no swap: zram é random-access, pré-leitura é desperdício.
vm.page-cluster = 0

# Controlo de páginas sujas: 256MB limite, 128MB background writeback.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 134217728

# Writeback menos frequente reduz micro-stutter de I/O (default 500 = 5s).
vm.dirty_writeback_centisecs = 1500
vm.dirty_expire_centisecs = 3000

# Memória livre mínima moderada — suficiente para evitar stalls sem forçar
# reclaim excessivo.
vm.min_free_kbytes = 67584

# Reclaim proativo mais agressivo: evita stalls de alocação quando a RAM
# está a encher. watermark_scale_factor=125 aumenta a zona de reclaim preventivo
# (default 10; Bazzite usa 125).
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# Desativa estatísticas NUMA dinâmicas e reduz overhead de contabilização.
vm.numa_stat = 0

# Reduz a frequência de atualização das estatísticas de memória.
vm.stat_interval = 10

# Compactação proativa muito baixa: reduz stalls de jogos sem deixar a
# memória ficar fragmentada.
vm.compaction_proactiveness = 5

# Não faz reclaim por zona (padrão recomendado para a maioria dos sistemas).
vm.zone_reclaim_mode = 0

# ──────────────────────────────────────────────────────────────────────────────
# Gaming / Wine / Proton / Steam
# ──────────────────────────────────────────────────────────────────────────────

# Máximo de áreas mmap por processo (obrigatório para muitos jogos via Proton).
vm.max_map_count = 2147483642

# ──────────────────────────────────────────────────────────────────────────────
# Filesystem / Desenvolvimento
# ──────────────────────────────────────────────────────────────────────────────

# Muitos watchers para IDEs, hot reload e monorepos.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288

# Limite alto de arquivos abertos para builds, containers e tooling.
fs.file-max = 2097152

# ──────────────────────────────────────────────────────────────────────────────
# Scheduler
# ──────────────────────────────────────────────────────────────────────────────

# Autogrouping por sessão de TTY: melhora interatividade quando o scheduler
# sched-ext (SCX) não está activo (fallback ao EEVDF). Inócuo sob SCX.
kernel.sched_autogroup_enabled = 1

# Reduz slice CFS de 5000µs para 3000µs: menor latência de scheduling.
# Inócuo sob SCX mas relevante no fallback EEVDF. Derivado de CachyOS.
kernel.sched_cfs_bandwidth_slice_us = 3000

# Desativa estatísticas detalhadas do scheduler, economizando ciclos de CPU.
kernel.sched_schedstats = 0

# ITMT (Intel Turbo Boost Max 3.0): prioriza os cores mais rápidos do chip no
# scheduling. O nó existe em qualquer kernel x86_64 com CONFIG_SCHED_MC_PRIO
# (padrão Fedora), independente do fabricante — em CPUs sem topologia ITMT
# (AMD, ou Intel sem favored cores) é um no-op inócuo, sem warning no journal.
# Derivado de Clear Linux (clr-power-tweaks/data.h: sched_itmt_enabled).
kernel.sched_itmt_enabled = 1

# ──────────────────────────────────────────────────────────────────────────────
# Notas / Omissões deliberadas
# ──────────────────────────────────────────────────────────────────────────────

# Não desactivamos kernel.split_lock_mitigate=0 nem kernel.nmi_watchdog=0,
# pois isso remove mitigações/diagnóstico e conflita com o hardening de
# segurança mantido em 60-security-hardening.conf.

