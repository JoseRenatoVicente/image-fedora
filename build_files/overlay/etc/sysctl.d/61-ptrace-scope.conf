# Restringe ptrace a processos filho/relacionados (bloqueia attach a
# processos não-filhos, o ataque relevante — roubo de tokens/cookies de
# outro processo do mesmo utilizador). ptrace_scope=2 (só CAP_SYS_PTRACE)
# quebrava gdb/strace/perf para o utilizador comum mesmo nos seus próprios
# processos — inaceitável numa imagem cujo alvo declarado é workstation/dev.
# scope=1 mantém a mitigação real sem essa regressão de DX.
kernel.yama.ptrace_scope = 1
