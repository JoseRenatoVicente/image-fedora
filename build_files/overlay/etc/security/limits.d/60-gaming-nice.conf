# Permite ao utilizador interativo (grupo wheel — mesma convenção usada em
# homebrew.conf para "o utilizador humano desta máquina") reduzir a
# prioridade de CPU de processos até -8 (niceness negativo = maior
# prioridade). Usado pelo Proton/Wine/Steam para priorizar threads de
# rendering e input sem necessitar de root. Escopo a wheel em vez de "*":
# num desktop single-user o risco prático é baixo, mas "*" também dava este
# poder a qualquer serviço/utilizador de sistema sem motivo.
@wheel hard nice -8
@wheel soft nice -8
