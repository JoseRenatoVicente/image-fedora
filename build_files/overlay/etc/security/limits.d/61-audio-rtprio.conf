# Prioridade de tempo real para o grupo "audio" (PipeWire/JACK/DAWs).
# Complementa usr/lib/udev/rules.d/61-audio-realtime.rules (acesso aos
# devices hpet/rtc0/cpu_dma_latency): sem rtprio, apps que chamam
# sched_setscheduler() directamente (JACK legado, DAWs) ficam limitadas à
# prioridade normal, pois nem sempre passam pelo rtkit-daemon via D-Bus.
# Derivado de cachyos-settings (20-audio.conf).
@audio - rtprio 99
@audio - nice  -11
