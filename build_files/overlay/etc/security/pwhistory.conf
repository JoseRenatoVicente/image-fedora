# CIS RHEL9 §5.3.3.4 — histórico de passwords (impede reutilização das últimas N).
# Lido por pam_pwhistory. NOTA: só tem efeito se pam_pwhistory estiver no stack
# PAM — o perfil authselect "minimal" NÃO o inclui por defeito. O 50-services.sh
# tenta ativar a feature with-pwhistory (best-effort); se a versão do authselect
# não a suportar, este ficheiro fica presente mas inativo (ver README/summary).
remember = 5
enforce_for_root
