# Configuração de lockout de conta (derivado de secureblue)

# Registrar tentativas para usuários não encontrados
audit

# Bloquear após 5 tentativas falhas consecutivas
deny = 5

# Desbloquear após 15 minutos (900 segundos) — mínimo exigido pelo CIS.
# 24h (86400s) foi rejeitado deliberadamente: com even_deny_root e o shell do
# root definido para nologin, 5 senhas erradas no lockscreen trancavam a
# única conta local da máquina por um dia inteiro, sem conta de recurso — a
# única saída seria editar kargs no GRUB. 5 tentativas/15min continua
# inviável para brute-force, sem o auto-DoS doméstico.
unlock_time = 900

# Bloquear também conta root
even_deny_root
