# WinApps — https://github.com/winapps-org/winapps
#
# Antes de usar:
#   1. Cria a VM Windows via virt-manager (nome: RDPWindows, ver docs/libvirt.md)
#   2. Habilita RDP na VM Windows (Definições → Sistema → Ambiente de Trabalho Remoto)
#   3. Preenche RDP_IP (virsh domifaddr RDPWindows), RDP_USER e RDP_PASS
#   4. Corre: winapps install
#
# Para setup inicial do sistema (grupos, rede libvirt): just winapps-setup

# Backend de virtualização: libvirt (KVM), docker ou podman
WAFLAVOR="libvirt"

# IP da VM Windows na rede libvirt (ex: 192.168.122.x)
# Obtém com: virsh domifaddr RDPWindows
RDP_IP=""

# Utilizador Windows com RDP habilitado
RDP_USER=""

# Password do utilizador Windows
# Em alternativa, deixa vazio e usa RDP_ASKPASS para prompt interactivo
RDP_PASS=""

# Nome da VM libvirt
VM_NAME="RDPWindows"

# Escala RDP em percentagem (100 = sem escala, 150 = HiDPI)
RDP_SCALE=100

# Flags extra para o FreeRDP (opcional)
RDP_FLAGS=""

# Modo debug (true = logs verbosos)
DEBUG="false"
