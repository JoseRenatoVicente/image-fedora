# Garante os drivers de storage no initramfs.
#
# Porquê explícito: o dracut do build corre dentro de um container, SEM /sys e
# /proc reais. Em modo --no-hostonly o dracut deveria incluir o conjunto genérico,
# mas sem enumeração de hardware o resultado pode sair sem os controladores de
# disco — e então o root nunca monta no alvo/VM → "boot has failed ... Halting".
# Forçar add_drivers copia os .ko a partir de /usr/lib/modules (não precisa do HW
# presente) e aplica-se também quando o bootc regenera o initramfs no alvo.
#
#  virtio_blk/virtio_scsi/virtio_pci — discos em VM/QEMU (caso do test-boot)
#  nvme/nvme_core                    — SSD NVMe (hardware real)
#  ahci/libahci/sd_mod               — SATA/SCSI
#  usb_storage/xhci_pci/xhci_hcd     — boot/instalação a partir de USB
add_drivers+=" virtio_blk virtio_scsi virtio_pci nvme nvme_core ahci libahci sd_mod usb_storage xhci_pci xhci_hcd "
