# Suporte a LUKS2 no initramfs. `crypt` é o módulo base (systemd-cryptsetup);
# tpm2-tss habilita o desbloqueio automático via token TPM2 (systemd-cryptenroll).
# `crypt` é explícito porque a regeneração runtime do bootc pode ser hostonly e
# só incluiria crypt se detectasse root em LUKS — explicitar é seguro.
#
# REMOVIDOS: fido2, pkcs11, pcsc
#   - pcsc abre um socket no initramfs que aguarda por um leitor de smart card;
#     na ausência de hardware, bloqueia o dracut-initqueue ~5s até timeout.
#   - fido2/pkcs11 só são necessários se o utilizador tiver uma chave FIDO2/PKCS11
#     como 2º factor de desbloqueio LUKS — cenário raro e opt-in.
#   Se necessário, o utilizador pode criar /etc/dracut.conf.d/91-luks-fido2.conf
#   com: add_dracutmodules+=" fido2 pkcs11 pcsc "
add_dracutmodules+=" crypt tpm2-tss "
