# Suporte a LUKS2 no initramfs. `crypt` é o módulo base (systemd-cryptsetup);
# tpm2-tss habilita o desbloqueio automático via token TPM2 (systemd lê o token
# LUKS2 enrolado por systemd-cryptenroll); fido2/pkcs11/pcsc para chaves de
# segurança. `crypt` é explícito porque a regeneração runtime do bootc pode ser
# hostonly e só incluiria crypt se detectasse root em LUKS — explicitar é seguro.
add_dracutmodules+=" crypt fido2 tpm2-tss pkcs11 pcsc "
