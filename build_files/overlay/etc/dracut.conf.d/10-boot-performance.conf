# Optimizações de boot para o initramfs.
#
# compress="zstd": torna a compressão explícita (Fedora 44 usa zstd por defeito
# em dracut; explicitar protege contra regressões se dracut alterar o default).
# zstd descomprime 2-3× mais rápido que xz com ratio similar.
#
# omit_dracutmodules: remove módulos sem uso neste hardware.
#   lvm     — sem LVM (root é btrfs directo em NVMe)
#   mdraid  — sem RAID de software
#   nvdimm  — sem persistent memory / NVDIMM
#   lunmask — LUN masking para SANs; irrelevante em desktop
compress="zstd"
omit_dracutmodules+=" lvm mdraid nvdimm lunmask "
