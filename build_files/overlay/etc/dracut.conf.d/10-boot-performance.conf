# Optimizações de boot para o initramfs.
#
# compress="zstd": torna a compressão explícita (Fedora 44 usa zstd por defeito
# em dracut; explicitar protege contra regressões se dracut alterar o default).
# zstd descomprime 2-3× mais rápido que xz com ratio similar.
#
# omit_dracutmodules: remove módulos sem uso seguro em layouts comuns.
# NÃO omitir lvm/mdraid aqui: o ISO deixa o Anaconda decidir o storage, e após
# updates o bootc regenera o initramfs no sistema instalado. Se o root estiver em
# LVM/RAID, omitir esses módulos causa "Boot has failed" no dracut.
compress="zstd"
omit_dracutmodules+=" nvdimm lunmask "
