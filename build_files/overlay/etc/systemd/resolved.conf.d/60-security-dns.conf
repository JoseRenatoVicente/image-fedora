[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net
FallbackDNS=1.0.0.1#cloudflare-dns.com 149.112.112.112#dns.quad9.net
DNSSEC=yes
# opportunistic (não yes): DNSOverTLS=yes é estrito e quebra portais cativos
# de hotel/aeroporto e split-DNS de VPN corporativa (NCSI já vai desligado em
# 40-hardening.conf, então não há outro mecanismo a detectar o portal).
# opportunistic ainda tenta TLS primeiro e só cai para texto simples quando o
# servidor não suporta — compromisso padrão para hardware móvel.
DNSOverTLS=opportunistic
