# Swap comprimido em RAM. Metade da RAM + 512 MB, limitado a 4 GB.
# Em máquinas com pouca RAM (≤ ~6 GB) isto dá ~3,3 GB de swap comprimido —
# foi swap cheio (2,4 GB na fórmula anterior, ram/4 + 1024) que deixou o
# oomd matar o VS Code. O zram-size é só um teto: páginas não usadas não
# custam RAM, e as usadas ficam comprimidas (ratio ~4x medido com o tier de
# recompressão zstd-15 do zram-recompress). Em máquinas com muita RAM o cap
# de 4 GB absorve a diferença — o comportamento não muda.
[zram0]
zram-size = min(ram / 2 + 512, 4096)
compression-algorithm=zstd
swap-priority = 100
fs-type = swap
