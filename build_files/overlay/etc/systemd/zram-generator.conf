# Swap comprimido em RAM. 1/4 da RAM + 1 GB de bónus fixo, limitado a 4 GB.
# O bónus fixo é irrelevante em máquinas com muita RAM (o cap de 4 GB
# absorve-o), mas em máquinas com pouca RAM (≤ ~6 GB, onde o
# low-resource-tuning.service liga swappiness=60) praticamente duplica o
# swap disponível — é aí que a folga extra faz falta.
[zram0]
zram-size = min(ram / 4 + 1024, 4096)
compression-algorithm=zstd
swap-priority = 100
fs-type = swap
