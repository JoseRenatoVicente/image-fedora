[Slice]
# Reclaim proativo estilo "memory pressure" do macOS: quando a soma das
# sessões de utilizador passa de 80% da RAM, o kernel comprime/liberta páginas
# para o zram de forma progressiva. É um limite SUAVE (throttla e recupera,
# nunca mata) — actua ANTES do systemd-oomd (que só mata a 80% de pressão PSI
# em 10-oomd.conf), tornando a degradação sob carga mais suave em vez de
# abrupta. Ajustável: baixar dá mais folga de RAM à custa de mais reclaim;
# subir aproxima-se do comportamento só-oomd.
MemoryHigh=80%
