[Service]
# Activa o merge de páginas idênticas (KSM) na cgroup da sessão de
# utilizador. Herdado pelos cgroups filhos (toolbox, distrobox, VMs em modo
# sessão), reduzindo footprint de RAM quando há várias instâncias com
# conteúdo de memória semelhante. Requer o scanner global activo (ver
# usr/lib/tmpfiles.d/ksm-enable.conf). Derivado de cachyos-ksm-settings.
MemoryKSM=yes
