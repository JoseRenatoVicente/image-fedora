[Unit]
# Adia o refresh da cache AppStream para depois da sessão gráfica estar activa.
# appstreamcli refresh --force é uma operação pesada (I/O + CPU) que não precisa
# de estar concluída para o utilizador ver o desktop. Diferir liberta CPU/IO
# durante o boot (~350ms poupados) e melhora a responsividade inicial do desktop.
After=graphical-session.target
