[Slice]
# Activa o merge de páginas idênticas (KSM) só nas VMs libvirt/qemu
# (machine.slice — local canónico dos cgroups de VM geridos por
# systemd-machined, tanto em modo sistema como sessão). Requer o scanner
# global activo (ver usr/lib/tmpfiles.d/ksm-enable.conf). Derivado de
# cachyos-ksm-settings, mas com o escopo corrigido: aplicar MemoryKSM=yes à
# sessão inteira do utilizador (user@.service) partilhava o CoW entre
# browser, gestor de passwords e todo o resto — o timing de copy-on-write
# pode revelar se uma página existe noutro processo/VM, por isso o KSM
# global ficou opt-in no kernel. Aqui o escopo fica só onde o ganho de
# memória (WinApps, VMs de desenvolvimento) compensa o risco.
MemoryKSM=yes
