[Unit]
# Adia o refresh de repos third-party para depois da sessão gráfica estar activa.
# O serviço original tem WantedBy=multi-user.target sem After= específico, o que
# o faz correr durante o boot cedo e compete com serviços críticos.
# Diferir para graphical-session.target garante que corre em background, depois
# do utilizador ver o desktop (~350ms poupados do caminho crítico de boot).
After=graphical-session.target

[Service]
# ionice idle: mesmo diferido para depois da sessão gráfica, este oneshot faz
# I/O (leitura de repos) que não é urgente — não deve competir com o desktop
# recém-iniciado (wiki ArchLinux "Improving performance" secção ionice).
IOSchedulingClass=idle
Nice=19
