[Unit]
# Remove After=network.target da unidade upstream do tuned.
# O perfil "balanced" configura CPU/energia e não precisa de rede activa.
# Ao remover esta dependência, tuned pode arrancar em paralelo com a
# inicialização de rede em vez de a aguardar, libertando a cadeia crítica:
#   network.target → tuned (1.3s) → tuned-ppd (0.2s) → graphical.target
#
# Como funciona em systemd drop-ins:
#   `After=` com valor vazio limpa TODOS os After= acumulados pelo unit original.
#   Os dois After= seguintes reestabelecem as dependências de ordenação mínimas.
After=
After=systemd-sysctl.service dbus.service polkit.service
