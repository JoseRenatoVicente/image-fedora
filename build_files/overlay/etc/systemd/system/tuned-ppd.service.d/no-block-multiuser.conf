[Unit]
# Remove Before=multi-user.target/graphical.target explicitos do proprio
# tuned-ppd. NAO E SUFICIENTE sozinho: graphical.target e um target, e
# systemd adiciona automaticamente After=tuned-ppd.service a graphical.target
# so por este ter Wants=tuned-ppd.service (via [Install] WantedBy=
# graphical.target) -- essa ordenacao e reconstruida pelo lado do target,
# nao aparece aqui. O fix real e desabilitar o enable em
# 35-security-desktop.preset ("disable tuned-ppd.service"); tuned-ppd
# continua a arrancar sob demanda via D-Bus (Type=dbus, BusName=
# org.freedesktop.UPower.PowerProfiles / net.hadess.PowerProfiles).
#
# Este drop-in fica so para o caso raro de alguem reativar o enable
# manualmente: mantemos Before=display-manager.target (power profile pronto
# quando a sessao arranca) e Before=shutdown.target (ordem de paragem).
Before=
Before=display-manager.target shutdown.target
