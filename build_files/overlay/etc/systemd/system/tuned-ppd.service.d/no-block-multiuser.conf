[Unit]
# Remove Before=multi-user.target e Before=graphical.target do tuned-ppd.
# Sem estas restricoes, o boot nao aguarda pela cadeia tuned-ppd -> tuned ->
# network.target para activar o graphical.target (ganho de ~1.5s).
#
# O servico continua a arrancar automaticamente (WantedBy=graphical.target)
# e em paralelo com o resto do boot. Mantemos Before=display-manager.target
# para que o gestor de sessao tenha power profiles activos ao arrancar, e
# Before=shutdown.target para garantir a ordem de paragem correcta.
Before=
Before=display-manager.target shutdown.target
