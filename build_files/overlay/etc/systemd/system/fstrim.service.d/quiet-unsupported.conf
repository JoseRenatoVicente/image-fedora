[Service]
ExecStart=
ExecStart=/sbin/fstrim -av --quiet-unsupported
SuccessExitStatus=0 64
# ionice idle: fstrim varre todos os filesystems listados no fstab e não tem
# deadline — corre de noite ou quando o timer dispara, sem precisar de
# competir com I/O interactivo do desktop (wiki ArchLinux "Improving
# performance" secção ionice).
IOSchedulingClass=idle
Nice=19
