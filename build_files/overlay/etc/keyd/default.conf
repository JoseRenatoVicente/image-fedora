# keyd — configuração por defeito.
# Aplica-se a todos os teclados; sem remapeamentos activos por defeito, para não
# alterar o comportamento das teclas numa instalação limpa. keyd corre como
# serviço de sistema, ao nível do /dev/uinput, sem depender de uma sessão gráfica.
#
# Para adicionar remaps, edita este ficheiro. Exemplo (capslock -> esc/ctrl):
#   [main]
#   capslock = overload(control, esc)
# Documentação: https://github.com/rvaiya/keyd

