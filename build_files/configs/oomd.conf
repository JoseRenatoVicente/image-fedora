# systemd-oomd: tuning para notebook com ZRAM agressivo (swappiness=100).
# As ações ManagedOOM por slice (matar em swap/pressão) vêm do pacote
# systemd-oomd-defaults; aqui só ajustamos os limiares globais.
# Instalado em /etc/systemd/oomd.conf.d/10-oomd.conf.
[OOM]
# Com ZRAM, o swap enche rápido sob pressão — agir a 90% evita thrashing.
SwapUsedLimit=90%
# Matar o cgroup mais faminto quando a pressão de memória passa de 60%
# sustentada durante 20s (PSI). Conservador para não matar apps legítimos.
DefaultMemoryPressureLimit=60%
DefaultMemoryPressureDurationSec=20s
