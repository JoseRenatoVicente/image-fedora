# Inclui o driver DRM do virtio-gpu no initramfs (módulo `virtio_gpu`, ficheiro
# virtio-gpu.ko). Sem ele, numa VM QEMU o boot fica assim: simpledrm (built-in)
# arranca o framebuffer e o Plymouth nele → 1s depois o virtio_gpu carrega (já no
# sistema real) e ROUBA o fb0 (handoff) → o Plymouth perde o ecrã e vê-se a consola.
# Tendo o virtio_gpu já no initramfs, ele vira o framebuffer ANTES do Plymouth
# arrancar (como i915/amdgpu/nouveau já fazem no HW real) → sem handoff, splash ok.
# simpledrm NÃO entra aqui: é built-in no kernel (modules.builtin).
force_drivers+=" virtio_gpu "
