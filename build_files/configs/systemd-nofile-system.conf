[Manager]
# Sobe o limite de file descriptors para serviços de sistema (toolchains de
# build, watchers, jogos via Proton). Derivado de cachyos-settings.
DefaultLimitNOFILE=2048:2097152
# Limite de processos por utilizador: previne exaustão da tabela de processos
# por fork bombs ou compilações paralelas descontroladas. Derivado de Garuda.
DefaultLimitNPROC=1048576
