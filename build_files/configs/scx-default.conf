# Configuração do scheduler sched-ext (SCX) — lido por scx.service
# (EnvironmentFile=/etc/default/scx). Carrega um scheduler BPF sobre o kernel
# Fedora assinado, sem recompilar o kernel nem tocar no Secure Boot.
#
# scx_lavd (Latency-criticality Aware Virtual Deadline): scheduler orientado a
# interatividade/gaming, equivalente prático ao "feel" do BORE do CachyOS.
# Alternativas: scx_bpfland (uso geral), scx_rusty (servidores/throughput).
SCX_SCHEDULER=scx_lavd

# --autopower: alterna performance/powersave conforme AC/bateria (ideal laptop).
# Para fixar desempenho máximo, troque por "--performance".
SCX_FLAGS=--autopower
