# keyd — remapeamento de teclas a nível de sistema (substitui o input-remapper).
# Documentação: https://github.com/rvaiti/keyd  (man keyd)
# Editar este ficheiro e correr:  sudo keyd reload
#
# Default no-op: keyd corre mas não remapeia nada até o utilizador descomentar.
# [ids] com '*' aplica a config a todos os teclados.

[ids]
*

[main]
# Exemplos comuns (descomentar para activar):
#
# capslock toca = Esc, segura = Control (muito popular):
# capslock = overload(control, esc)
#
# Trocar capslock por control:
# capslock = control
#
# Layer com a tecla Menu (compose) para navegação vim-like:
# menu = layer(nav)
#
# [nav]
# h = left
# j = down
# k = up
# l = right
