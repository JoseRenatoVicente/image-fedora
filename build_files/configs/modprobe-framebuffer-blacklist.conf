# Framebuffer drivers: geralmente buggy, mal suportados, e causam
# falhas de suspend e kernel panics. Não carregar automaticamente.
# (Upstream: Ubuntu kmod blacklist-framebuffer.conf, filtrado para Fedora)

blacklist cyber2000fb
blacklist cyblafb
blacklist gx1fb
blacklist hgafb
blacklist lxfb
blacklist matroxfb_base
blacklist neofb
blacklist pm2fb
blacklist s1d13xxxfb
blacklist sisfb
blacklist vesafb
blacklist vfb
blacklist vt8623fb
blacklist udlfb
