# Afinação de Transparent HugePages (derivado de cachyos-settings).
# defrag=defer+madvise: desfragmentação assíncrona — ganho para alocadores
# como tcmalloc/Go/Chromium sem pausas síncronas de compactação.
w! /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
# THP shrinker (kernel 6.12+): divide qualquer THP com >80% de páginas a zero
# (409 de 512). Evita o overprovisioning de memória do THP=always e o OOM
# prematuro que daí resulta, mantendo o ganho de performance.
w! /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409

# MGLRU (Multi-Gen LRU) — activo por default no kernel 6.6+, mas min_ttl_ms=1000
# impede que páginas quentes sejam evictadas prematuramente durante memory pressure.
w! /sys/kernel/mm/lru_gen/enabled    - - - - Y
w! /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000

# HPET e RTC — frequência máxima para processos userspace (default 64 Hz).
# Necessário para PipeWire/JACK com quantum baixo (32/64 samples); sem isto
# o kernel rejeita rates altos mesmo que o grupo audio tenha acesso ao device.
# Derivado de Garuda Linux.
w! /proc/sys/dev/hpet/max-user-freq    - - - - 3072
w! /sys/class/rtc/rtc0/max_user_freq  - - - - 3072
