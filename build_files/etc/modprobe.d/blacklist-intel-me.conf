# Intel Management Engine — remove userspace attack surface.
# IME é um co-processador always-on com histórico de CVEs (SA-00086).
# Blacklistar os drivers kernel não desactiva o IME (requer me_cleaner/BIOS),
# mas elimina o vetor de ataque kernel-side. Adotado por Garuda, Whonix, Tails.
# Tradeoff: quebra vPro/AMT — irrelevante em desktop.
blacklist mei
blacklist mei_me
