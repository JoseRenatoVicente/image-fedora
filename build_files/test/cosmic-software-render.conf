# Imagem de teste apenas — força render de software (Mesa/llvmpipe) para o
# cosmic-comp arrancar numa VM QEMU headless sem GPU acelerada. Formato
# systemd environment.d (KEY=VALUE simples, sem shell) — aplica-se a todos os
# processos da sessão do utilizador, incluindo cosmic-session/cosmic-comp.
# NÃO usar em produção.
#
# NOTA: ao contrário do KWin (que expunha KWIN_COMPOSE=Q para forçar QPainter),
# o cosmic-comp é Smithay/Rust e a necessidade real deste override ainda não
# foi confirmada numa VM de teste ao vivo — pode ser que o virtio-gpu da VM já
# baste sem isto. Mantido por precaução (mesma VM que exigia isto para o KWin);
# ajustar/remover depois de validar um boot real.
LIBGL_ALWAYS_SOFTWARE=1
GALLIUM_DRIVER=llvmpipe
